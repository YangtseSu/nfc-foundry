name: check

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            libudev-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            desktop-file-utils \
            xvfb
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: GTK UI tests
        run: |
          env -u WAYLAND_DISPLAY NFC_FOUNDRY_GUI_TESTS=1 \
            xvfb-run -a env GDK_BACKEND=x11 \
            cargo test -p nfc-foundry --bin nfc-foundry \
            app::tests::desfire_workspace_switches_and_parses_inputs -- --exact
          env -u WAYLAND_DISPLAY NFC_FOUNDRY_GUI_TESTS=1 \
            xvfb-run -a env GDK_BACKEND=x11 \
            cargo test -p nfc-foundry --bin nfc-foundry \
            app::tests::gtk_workbench_scenarios -- --exact
      - name: Desktop entry
        run: desktop-file-validate resources/nfc-foundry.desktop
      - name: REUSE
        uses: fsfe/reuse-action@v6
