name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version; defaults to [workspace.package].version
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Resolve and verify the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          fi
          if [ "$version" != "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" ]; then
            echo "version $version does not match Cargo.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build Linux amd64 binaries
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build/nfc-foundry"
          export RUSTFLAGS="$RUSTFLAGS --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo"
          cargo build --release --locked --workspace \
            --target x86_64-unknown-linux-gnu

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          build="target/x86_64-unknown-linux-gnu/release"
          name="nfc-foundry-$VERSION-x86_64"
          stage="dist/$name"
          install -d "$stage/bin" "$stage/lib/udev/rules.d" \
            "$stage/share/nfc-foundry" "$stage/share/licenses/nfc-foundry"
          install -m 0755 "$build/nfctl" "$stage/bin/nfctl"
          install -m 0644 resources/udev/70-nfc-foundry.rules \
            "$stage/lib/udev/rules.d/70-nfc-foundry.rules"
          cp -a resources/hardnested_tables "$stage/share/nfc-foundry/"
          install -m 0644 LICENSE "$stage/share/licenses/nfc-foundry/LICENSE"
          install -Dm644 LICENSES/GPL-3.0-or-later.txt \
            "$stage/share/licenses/nfc-foundry/LICENSES/GPL-3.0-or-later.txt"
          install -m 0644 NOTICE "$stage/share/licenses/nfc-foundry/NOTICE"
          install -m 0644 THIRD_PARTY_NOTICES.md \
            "$stage/share/licenses/nfc-foundry/THIRD_PARTY_NOTICES.md"
          install -m 0644 README.md "$stage/README.md"
          install -m 0644 Cargo.lock "$stage/Cargo.lock"
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist "$name" | gzip -n -9 >"dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" >SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: nfc-foundry-${{ steps.version.outputs.version }}-linux-amd64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          assets=(
            "dist/nfc-foundry-$VERSION-x86_64.tar.gz"
            "dist/SHA256SUMS"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --title "NFC Foundry $VERSION" \
              --generate-notes "${assets[@]}"
          fi
