[package]
name = "nfc-foundry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nfc-foundry"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
nfc-app.workspace = true
nfc-classic.workspace = true
nfc-core.workspace = true
nfc-drivers = { workspace = true, default-features = false }
nfc-ndef.workspace = true
nfc-pboc.workspace = true
nfc-recover.workspace = true
nfc-transport.workspace = true
nfc-type2.workspace = true
nfc-type4.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
nfc-amiibo.workspace = true
nfc-classic-ndef.workspace = true
tempfile = "3"

[features]
default = ["acr122-pcsc"]
acr122-pcsc = ["nfc-drivers/acr122-pcsc"]

[lints]
workspace = true
